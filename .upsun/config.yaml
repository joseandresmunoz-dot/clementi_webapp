applications:
  app:
    type: "python:3.12"

    relationships:
      database: "db:postgresql"

    hooks:
      build: |
        set -eux
        pip install --upgrade pip
        pip install -r requirements.txt
      deploy: |
        set -eux

        if [ -n "${GOOGLE_CALENDAR_CREDENTIALS_JSON:-}" ]; then
          mkdir -p private_media
          echo "$GOOGLE_CALENDAR_CREDENTIALS_JSON" > "$GOOGLE_CALENDAR_CREDENTIALS_FILE"
        fi

        python manage.py collectstatic --noinput
        python manage.py migrate

    web:
      commands:
        start: "gunicorn -b unix:$SOCKET config.wsgi"
      upstream:
        socket_family: unix
      locations:
        "/":
          passthru: true
        "/static":
          allow: true
          expires: 1h
          root: "staticfiles"

    mounts:
      "/staticfiles":
        source: "local"
        source_path: "static_assets"
      "/private_media":
        source: "local"
        source_path: "private_assets"
      "/media":
        source: "local"
        source_path: "media_assets"
