{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión — Microbiota y Salud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="{% static 'images/favicon/favicon.ico' %}" type="image/x-icon">
    <style>
        body { background: #f8f7ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        .offline-card { text-align: center; max-width: 420px; padding: 3rem 2rem; }
        .offline-icon { font-size: 4rem; color: #7c6fff; margin-bottom: 1.5rem; }
        .offline-card h1 { font-size: 1.5rem; font-weight: 700; color: #1a1a2e; margin-bottom: .75rem; }
        .offline-card p { color: #6b7280; margin-bottom: 2rem; }
        .btn-retry { background: #7c6fff; color: #fff; border: none; padding: .75rem 2rem; border-radius: 50px; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn-retry:hover { background: #6b5ee0; color: #fff; }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon"><i class="bi bi-wifi-off"></i></div>
        <h1>Sin conexión</h1>
        <p>Parece que no tenés Internet en este momento. Revisá tu conexión y volvé a intentar.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <i class="bi bi-arrow-clockwise me-2"></i>Reintentar
        </button>
    </div>
</body>
</html>
