{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión — Microbiota y Salud</title>
    <link rel="icon" href="{% static 'images/favicon/favicon.ico' %}" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #F8F5FA; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #251833; }
        .offline-card { text-align: center; max-width: 420px; padding: 3rem 2rem; }
        .offline-icon { width: 88px; height: 88px; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #F1E9F8; }
        .offline-icon svg { width: 44px; height: 44px; fill: #82459D; }
        .offline-card h1 { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; font-weight: 700; color: #251833; margin-bottom: .75rem; }
        .offline-card p { color: #6E5B7D; margin-bottom: 2rem; line-height: 1.5; }
        .btn-retry { background: #CE4888; color: #fff; border: none; padding: .75rem 2rem; border-radius: 50px; font-weight: 600; font-size: 0.95rem; text-decoration: none; display: inline-block; cursor: pointer; transition: background 0.3s, transform 0.2s; }
        .btn-retry:hover { background: #B1376F; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.1 5.1l1.4-1.4 16.8 16.8-1.4 1.4-3.2-3.2H6.7A4 4 0 0 1 6.7 11L2.1 5.1zM12 2a10 10 0 0 1 9.9 11.2l-2.1-2.1A8 8 0 0 0 15 3.8V2zM8.2 18.5l3.8 3.8 3.8-3.8H8.2zM4.1 8.7l2.1 2.1a4.02 4.02 0 0 1 .6-1.5L4.1 8.7z"/></svg>
        </div>
        <h1>Sin conexión</h1>
        <p>Parece que no tenés Internet en este momento. Revisá tu conexión y volvé a intentar.</p>
        <button class="btn-retry" onclick="window.location.reload()">Reintentar</button>
    </div>
</body>
</html>
