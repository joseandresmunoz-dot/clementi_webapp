upstream django {
    server app:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name microbiotaysaludintegralrc.ar;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name microbiotaysaludintegralrc.ar;

    ssl_certificate /etc/letsencrypt/live/microbiotaysaludintegralrc.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/microbiotaysaludintegralrc.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://django;
        proxy_redirect off;
    }
}
